<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="portal">

        <header class="header">
            <div class="logo">◆</div>

            <h1>Company Portal</h1>

            <p>Quick access to company applications</p>
        </header>


        <section class="applications">

            <a
                href="http://192.168.1.110:8080"
                class="application-card">

                <div class="application-icon">
                    📦
                </div>

                <div class="application-info">
                    <h2>Warehouse Report</h2>
                    <p>Report and manage warehouse incidents</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a
                href="http://192.168.1.110:8081"
                class="application-card">

                <div class="application-icon">
                    👥
                </div>

                <div class="application-info">
                    <h2>Customer Info</h2>
                    <p>Search and manage customer information</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a
                href="http://192.168.1.110:5000"
                class="application-card">

                <div class="application-icon">
                    ✍️
                </div>

                <div class="application-info">
                    <h2>PDF Signature Manager</h2>
                    <p>Sign and manage PDF documents</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>

        </section>


        <footer>
            Company Internal Applications
        </footer>

    </main>

</body>
</html>
